# www.salvatoreemilio.it arriva dallo stesso router Traefik: redirect al dominio principale
server {
    listen       17000;
    listen  [::]:17000;
    server_name www.salvatoreemilio.it;
    return 301 https://salvatoreemilio.it$request_uri;
}

server {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    listen       17000 default_server;
    listen  [::]:17000 default_server;
    server_name salvatoreemilio.it;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # add_header nelle location sostituisce quelli ereditati: gli header di sicurezza sono ripetuti in ognuna

    # Asset con hash nel nome generati da Vite: cache lunga
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /en {
        return 301 /en/;
    }

    # Solo le pagine prerenderizzate: un percorso inesistente è un 404, non la home
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html =404;
    }
}
